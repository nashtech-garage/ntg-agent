# Local-dev nginx gateway for the per-agent LightRAG containers. Identical routing to
# deploy/lightrag-postgres/gateway/nginx.conf but plain HTTP on :8080 (no TLS locally) —
# the Orchestrator's default LightRag:GatewayUrl is http://localhost:8080.

server {
    listen 8080;

    # Docker's embedded DNS. valid=10s so a recreated container's new IP is picked up
    # quickly; a stopped/removed container gets NXDOMAIN -> fast 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 200m;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    location = /gateway-health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~ ^/agents/(?<agent>[0-9a-fA-F-]{36})/(?<rest>.*)$ {
        # Variable in proxy_pass forces per-request DNS resolution, so containers created
        # after nginx started are routable without a reload.
        proxy_pass http://lightrag-agent-$agent:9621/$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location / { return 404; }
}
