# nginx gateway for the per-agent LightRAG containers (remote Ubuntu server).
#
# Routes https://<server>/agents/{agentId}/* to the lightrag-agent-{agentId} container
# by NAME over the ntg-agent-lightrag Docker network — containers publish no host ports,
# so this is the only inbound path to them. TLS terminates here with the server's
# certificate; containers serve plain HTTP on :9621.
#
# The Orchestrator's LightRagContainerManager attaches this container to the
# ntg-agent-lightrag network at runtime (same mechanism as lightrag-postgres), which is
# what makes the container names resolvable from here.

server {
    listen 443 ssl;

    ssl_certificate     /certs/server-cert.pem;
    ssl_certificate_key /certs/server-key.pem;

    # Docker's embedded DNS. valid=10s so a recreated container's new IP is picked up
    # quickly; a stopped/removed container gets NXDOMAIN -> fast 502 (the Orchestrator's
    # health probe treats non-2xx as "container down" and re-provisions).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Document uploads can be large, and LightRAG /query invokes an LLM (minutes, and the
    # Orchestrator's own attempt timeout is 2 min) — defaults of 1m body / 60s read are
    # far too small.
    client_max_body_size 200m;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # The gateway's own liveness, distinct from any agent's health endpoint.
    location = /gateway-health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Quoted: the {36} brace would otherwise be parsed as an nginx config block.
    location ~ "^/agents/(?<agent>[0-9a-fA-F-]{36})/(?<rest>.*)$" {
        # Using a variable in proxy_pass forces per-request DNS resolution, so containers
        # created after nginx started are routable without a reload.
        proxy_pass http://lightrag-agent-$agent:9621/$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't buffer LLM responses; LightRAG can stream.
        proxy_buffering off;
    }

    location / { return 404; }
}

# Container-internal listener for the compose healthcheck (port 80 is not published, so
# it is unreachable from outside the Docker host).
server {
    listen 80;

    location = /gateway-health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / { return 404; }
}
