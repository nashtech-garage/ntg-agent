# LightRAG knowledge stack for the dedicated Ubuntu server: the standalone
# pgvector + Apache AGE Postgres, plus the nginx gateway that fronts the
# per-agent LightRAG containers.
#
# Postgres replaces the `lightrag-postgres` resource that used to live in the .NET
# AppHost. It is reached by the Orchestrator directly over TLS on 5432. It reuses
# the existing image and init SQL:
#   build context: ../../scripts/lightrag-postgres  (pgvector + Apache AGE image)
#   init scripts:  ../../scripts/lightrag-pg-init    (creates DB + extensions)
#
# The gateway (gateway/nginx.conf) terminates TLS on 443 and routes
# /agents/{agentId}/* to that agent's container by name over the Docker network;
# agent containers publish no host ports.
#
# Usage on the server:
#   cp .env.example .env        # then set POSTGRES_PASSWORD, PG_CERT_DIR, GATEWAY_CERT_DIR
#   docker compose up -d
#
# TLS: Postgres refuses to start if its key file is group/world readable or is not
# owned by the user the server runs as (uid 999 in this image). The certificates in
# ~/docker-certs are owned by the SSH user, so stage a copy for Postgres first:
#
#   mkdir -p ~/docker-certs/pg
#   cp ~/docker-certs/server-cert.pem ~/docker-certs/server-key.pem ~/docker-certs/pg/
#   sudo chown 999:999 ~/docker-certs/pg/*
#   sudo chmod 600 ~/docker-certs/pg/server-key.pem
#
# `ssl=on` is additive: pg_hba.conf keeps its default `host ... scram-sha-256` rules, so
# the per-agent containers reaching Postgres over the Docker bridge are unaffected.
#
# The containers are deliberately named "lightrag-postgres" / "lightrag-gateway" so
# the Orchestrator's LightRagContainerManager can find them by name and attach them
# to the `ntg-agent-lightrag` network. The Orchestrator owns that network (it
# creates and connects it), so it is intentionally NOT declared here.

services:
  lightrag-postgres:
    build:
      context: ../../scripts/lightrag-postgres
    image: lightrag-postgres:pg17-pgvector-age
    container_name: lightrag-postgres
    restart: unless-stopped
    environment:
      # Must match the Orchestrator's LightRag__PostgresPassword (the
      # `lightrag-pg-password` AppHost parameter).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Serve TLS. The Orchestrator connects with `SSL Mode=Require`
    command: >
      -c ssl=on
      -c ssl_cert_file=/certs/server-cert.pem
      -c ssl_key_file=/certs/server-key.pem
    ports:
      # Published on all interfaces so the Orchestrator can reach it directly. Inbound
      # access is restricted to the team's source IPs by the Azure's NSG rules.
      - "5432:5432"
    volumes:
      - lightrag-postgres-data:/var/lib/postgresql/data
      # First-init scripts: create the `uploaded-documents` DB and the
      # vector + age extensions. Run only when the data volume is empty.
      - ../../scripts/lightrag-pg-init:/docker-entrypoint-initdb.d:ro
      # Staged certificate copy, owned by uid 999 (see the header note).
      - ${PG_CERT_DIR:?set PG_CERT_DIR in .env}:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  lightrag-gateway:
    image: nginx:1.28-alpine
    container_name: lightrag-gateway
    restart: unless-stopped
    ports:
      # Published on all interfaces so the Orchestrator can reach it directly. Inbound
      # access is restricted to the team's source IPs by the Azure NSG rules.
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Server certificate + key (same pair Postgres serves). nginx runs as root in the
      # container, so no ownership staging is needed — mount ~/docker-certs directly.
      - ${GATEWAY_CERT_DIR:?set GATEWAY_CERT_DIR in .env}:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/gateway-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lightrag-postgres-data:
