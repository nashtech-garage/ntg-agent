name: NTG Agent Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  sonarcloud:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore src/NTG.Agent.sln

      - name: Build
        run: dotnet build src/NTG.Agent.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test src/NTG.Agent.sln --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger trx \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: SonarCloud Analysis (with .NET scanner)
        uses: highbyte/sonarscan-dotnet@35fdf84a8154dbc65146e53ddc062a506c5d05b8 # v2.6.0
        with:
          sonarProjectKey: ${{ secrets.SONAR_PROJECT_KEY }}
          sonarProjectName: ntg-agent
          sonarOrganization: ${{ secrets.SONARCLOUD_ORGANIZATION_KEY }}
          dotnetBuildArguments: src/NTG.Agent.sln --configuration Release
          dotnetTestArguments: src/NTG.Agent.sln --logger trx --collect:"XPlat Code Coverage" --results-directory ./TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          sonarBeginArguments: /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" /d:sonar.coverage.exclusions="**/NTG.Agent.AppHost/**,**/Program.cs,**/Migrations/**,**/*Migration*.cs,**/*Migration*.Designer.cs,**/AgentDbContextModelSnapshot.cs,**/*.razor.css,**/wwwroot/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
